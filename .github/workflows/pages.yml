# Publica a loja no GitHub Pages.
# Roda a cada envio para a branch main e também todo dia de manhã,
# para as páginas de SEO (produtos, categorias, sitemap) acompanharem
# o que foi alterado no painel do ateliê.
name: Publicar site

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * *' # 6h no horário de Brasília
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar páginas de SEO
        run: node tools/seo-build.js --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
